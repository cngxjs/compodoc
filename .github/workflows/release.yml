name: Release

# Triggers when a tag matching v* (e.g. v0.0.1, v0.1.0, v1.0.0-beta.2) is pushed.
# Build → unit tests → npm publish to public registry under @cngxjs scope.
#
# Authentication: OIDC via npm Trusted Publisher.
# The @cngxjs/compodocx package on npm is configured (Settings →
# Trusted Publisher) to trust the cngxjs/compodocx repo's release.yml
# workflow. The npm CLI picks up the GitHub Actions OIDC token
# automatically when this workflow runs `npm publish` and exchanges it
# for a short-lived publish credential. No NPM_TOKEN, no long-lived
# secret to leak or rotate.
#
# To release: bump package.json version, commit, tag, push tag.
#   npm version 0.0.3          # writes package.json + creates v0.0.3 commit + tag
#   git push origin develop --follow-tags
# Or via release-it (see .release-it.json):
#   npx release-it patch       # interactive bump + tag + push
#
# This workflow does NOT create the tag — it only reacts to tag pushes.

on:
    push:
        tags:
            - 'v*'

# Provenance attestations require the workflow to write OIDC tokens.
permissions:
    contents: read
    id-token: write

jobs:
    publish:
        name: Build and publish to npm
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            # Node 24 ships with npm >= 11.5.1 which is required for the
            # Trusted Publisher (OIDC) flow that exchanges the GitHub Actions
            # OIDC token for a short-lived publish credential. Node 22 ships
            # with npm 10.x which silently falls back to anonymous publish
            # and the registry responds with a misleading 404.
            - name: Use Node.js 24.x
              uses: actions/setup-node@v4
              with:
                  node-version: 24.x
                  registry-url: 'https://registry.npmjs.org/'
                  scope: '@cngxjs'

            - name: Cache node modules
              uses: actions/cache@v4
              with:
                  path: node_modules
                  key: ${{ runner.OS }}-release-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.OS }}-release-
                      ${{ runner.OS }}-build-

            - name: Install Dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Unit tests
              run: npm run test:unit

            - name: Verify tag matches package.json version
              run: |
                  PKG_VERSION=$(node -p "require('./package.json').version")
                  TAG_VERSION="${GITHUB_REF_NAME#v}"
                  if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
                      echo "::error::Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match package.json version $PKG_VERSION"
                      exit 1
                  fi
                  echo "Tag and package.json agree on $PKG_VERSION"

            - name: Show what would be published
              run: npm pack --dry-run

            - name: Publish to npm (OIDC via Trusted Publisher)
              run: npm publish --access public --provenance
