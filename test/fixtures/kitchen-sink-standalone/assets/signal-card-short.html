<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Signal Card — short example</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                font-family: system-ui, sans-serif;
            }
            body {
                padding: 16px;
                background: #f7f7f7;
            }
            .card {
                border: 1px solid #d0d7de;
                border-radius: 8px;
                background: #fff;
                padding: 16px 20px;
            }
            h2 {
                margin: 0 0 8px;
                font-size: 1rem;
            }
            p {
                margin: 0;
                color: #555;
            }
        </style>
    </head>
    <body>
        <article class="card">
            <h2>Short example</h2>
            <p>Single-paragraph card — should keep the iframe tight.</p>
        </article>
    </body>
</html>
