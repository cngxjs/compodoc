<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Signal Card — medium example</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                font-family: system-ui, sans-serif;
            }
            body {
                padding: 16px;
                background: #f0f4ff;
            }
            .card {
                border: 1px solid #c3d0ff;
                border-radius: 8px;
                background: #fff;
                padding: 16px 20px;
            }
            h2 {
                margin: 0 0 12px;
                font-size: 1rem;
            }
            ul {
                margin: 0;
                padding-left: 1.25rem;
                color: #34405b;
            }
            li {
                margin-bottom: 6px;
            }
        </style>
    </head>
    <body>
        <article class="card">
            <h2>Medium example</h2>
            <p>Three bullet points — taller than the short example.</p>
            <ul>
                <li>Title is a required input signal.</li>
                <li>Expanded is a two-way model signal.</li>
                <li>Variant switches between filled / outlined / elevated.</li>
            </ul>
        </article>
    </body>
</html>
